<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiny Help Desk Chat</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-role="guest">

  <!-- Main Centered Application Frame -->
  <main class="shell">

    <section class="hero">
      <div>
        <h1>Tiny Help Desk</h1>
        <p class="subtitle">A just-for-fun customer service style chat. No phone numbers, no accounts, just open the link and start typing.</p>
      </div>
    </section>

    <section class="card chat-card" aria-label="Guest chat">
      <header class="topbar">
        <div class="title-block">
          <strong>Customer chat</strong>
          <span class="meta"><span id="status">Connecting...</span> - Room <span id="roomLabel">lobby</span></span>
        </div>
        <div class="toolbar">
          <label class="meta" for="nameInput">Display name</label>
          <input id="nameInput" aria-label="Display name" maxlength="40">
        </div>
      </header>

      <div class="messages" id="messages" aria-live="polite">
        <div class="empty" id="empty"><div class="empty-icon">🐾</div><strong>Meow-nagement Dashboard</strong><br>No active tickets in the queue. Everything is running purr-fectly!</div>
      </div>

      <!-- Dedicated typing container pinned permanently right below the scroll area -->
      <div id="typing-container" style="min-height: 25px; padding: 0 15px; background: transparent;"></div>

      <form class="composer" id="composer">
        <input type="file" id="file-input" accept="image/*" hidden />
        <button type="button" id="attachment-btn" class="attachment-btn" aria-label="Attach File">+</button>
        <input id="messageInput" autocomplete="off" maxlength="1200" placeholder="Type a message..." aria-label="Message">
        <button class="primary" type="submit">Send</button>

        <div id="drop-zone" class="drop-zone-overlay">
          <span class="drop-zone-icon">🐾</span>
          <span class="drop-zone-text">Drop image to attach</span>
        </div>
      </form>
    </section>

  </main>

  <script src="/app.js"></script>
</body>
</html>
